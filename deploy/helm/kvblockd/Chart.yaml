apiVersion: v2
name: kvblockd
description: >-
  kvblockd — KV-cache block store daemon: batched multi-stream TCP,
  DRAM->NVMe->S3 tiering, namespace multi-tenancy. A plain chart, no
  operator (locked non-goal): one StatefulSet, config from a ConfigMap,
  namespaces/tokens from a Secret.
type: application
version: 0.1.1
# appVersion tracks the latest PUBLISHED release (the image tag the chart
# pulls by default) — never an unreleased local tag; release checklist:
# bump this in the same change as the tag push.
appVersion: "0.2.0"
home: https://github.com/rudraymehra/KVStash
sources:
  - https://github.com/rudraymehra/KVStash
keywords:
  - kv-cache
  - llm
  - inference
  - vllm
maintainers:
  - name: Rudray Mehra
    email: rudraymehra@gmail.com
