# LMCache config selecting kvblockd as the remote backend (plugin path).
#
# NO remote_url here, on purpose: in lmcache 0.5.x the plugin backend dials a
# virtual "plugin://kvblockd" URL and the real endpoint MUST come from
# extra_config["remote_storage_plugin.kvblockd.url"]. Setting remote_url too
# would create a SECOND (deprecated) RemoteBackend and double every put.
# python/lmcache_kvblockd/tests/test_lmcache_registration.py proves LMCache
# selects our connector from THIS file.
chunk_size: 256
local_cpu: true
remote_storage_plugins: ["kvblockd"]
extra_config:
  kvblockd_token: "e2e-token"
  remote_storage_plugin.kvblockd.module_path: "lmcache_kvblockd.adapter"
  remote_storage_plugin.kvblockd.class_name: "KvblockdConnectorAdapter"
  remote_storage_plugin.kvblockd.url: "kvblockd://127.0.0.1:9440?namespace=lmcache&streams=4"
