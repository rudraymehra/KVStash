# bench/VERSIONS.lock — every pin the benchmark suite depends on.
# Frozen so a stranger reproduces Chart 1 for ~$12 and Chart 2 exactly.
# Format: one "key = value  # note" per line.
#
# NOTE (2026-07-18; amended 2026-07-25): image digests below read PENDING.
# The intent was to record each digest at the first rig pull. Recorded
# exception: the 2026-07-19 rig-t session pulled redis:7.4 and valkey:8.1 by
# TAG and their digests were not captured before teardown, so the committed
# rig-t baseline results (bench/results/rig-t/) are pinned by tag, not
# digest — a re-pull of those tags is not guaranteed byte-identical. Digests
# will be recorded at the next session that pulls these images. Entries that
# have never run on a rig (etcd, mooncake) stay PENDING; no chart may be
# built from a baseline that has never run.

## Go bench dependencies (already in go.mod)
go = 1.26
go-redis = github.com/redis/go-redis/v9 v9.21.0          # zero-copy GetToBuffer/SetFromBuffer (the strongest-client bar)
hdrhistogram = github.com/HdrHistogram/hdrhistogram-go v1.1.2  # 3-sig-fig percentiles + .hgrm

## Baseline services (tag-pinned; digest capture pending — see NOTE above)
valkey   = valkey/valkey:8.1@sha256:PENDING      # io-threads 8, save "", appendonly no, allkeys-lru; ran 2026-07-19 by tag
redis    = redis:7.4@sha256:PENDING              # same config as valkey for the go-redis bar; ran 2026-07-19 by tag
etcd     = quay.io/coreos/etcd:v3.5.17@sha256:PENDING   # Mooncake metadata store only; never run
mooncake = kvcache-ai/mooncake:LATEST-TAG@sha256:PENDING  # protocol="tcp"; never run — tag + non-default knobs to be pinned at the session (baselines/docker-compose.yml + baselines/README.md)

## Baseline clients
redis-py = 8.0.1     # the client LMCache actually ships (RESP3 default; we report RESP2 & RESP3 if they differ >5%). 8.0.1 requires Python >=3.10 — AL2023's default python3.9 pip does NOT see it (its `pip index` shows 7.0.1 max); the rig installs python3.11 and runs the driver with it. A mid-session note here briefly claimed 8.0.1 didn't exist on PyPI — that was the 3.9 filter, corrected 2026-07-19.

## GPU stack (Rig E, AWS g5.xlarge — A10G)
vllm    = 0.25.1     # matches the CPU e2e recipe pin (bench/e2e/cpu)
lmcache = 0.5.1      # + lmcache_kvblockd (python/lmcache_kvblockd)
model   = meta-llama/Llama-3.1-8B-Instruct
torch   = cu124      # CUDA 12.4 wheels (A10G, sm_86)

## Measurement tools
iperf3 = 3.16        # multithreaded -P; the transport ceiling
fio    = 3.36        # 128k/1M seq QD32; the NVMe device ceiling

## Traces (SHAs recorded by traces/fetch.sh at clone time)
bailian_repo  = alibaba-edu/qwen-bailian-usagetraces-anon @ PENDING-SHA
mooncake_repo = kvcache-ai/Mooncake @ PENDING-SHA          # FAST25-release/traces/
